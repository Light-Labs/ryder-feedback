# Checks every pull request; deploys main to Firebase. See DEPLOY.md.
#
# No secrets: the deploy job trades GitHub's OIDC token for short-lived
# Google credentials (Workload Identity Federation). Google only accepts
# tokens from this repository's main branch, so a fork, a pull request or
# another branch cannot deploy even if this file is edited.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through a rollout.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: basic-bison-508123-k7
  FIREBASE_TOOLS: firebase-tools@15.33.0

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      # The rules decide who can read the review queue. They deploy from this
      # repo on every push, so they are tested on every push.
      - name: Firestore rules tests
        run: npx -y $FIREBASE_TOOLS emulators:exec --only firestore "node --test tests/rules.test.mjs"
      # Reported but non-blocking by choice: the rules tests guard what can
      # leak; these guard presentation (ranking, generated names).
      - name: Unit tests
        continue-on-error: true
        run: npm run test:unit

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/648320838171/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@basic-bison-508123-k7.iam.gserviceaccount.com
      # Rules and indexes first: the app's queries depend on both.
      - name: Deploy rules and indexes
        run: npx -y $FIREBASE_TOOLS deploy --only firestore:rules,firestore:indexes --project $PROJECT_ID --non-interactive
      - name: Deploy app
        run: npx -y $FIREBASE_TOOLS deploy --only apphosting --project $PROJECT_ID --non-interactive
      - name: Pending ideas are not public
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/posts/frill_create-support-for-monero")
          echo "pending post: $code"
          test "$code" = 403
